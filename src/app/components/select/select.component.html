<div class="space-y-1.5">
    @if (label) {
        <p class="uppercase font-bold text-muted text-sm tracking-wider">{{ label }}</p>
    }

    <div class="relative">
        <button
            #trigger
            type="button"
            role="combobox"
            aria-haspopup="listbox"
            [attr.aria-label]="label || null"
            [attr.aria-expanded]="isOpen()"
            [attr.aria-controls]="uid + '-listbox'"
            [attr.aria-activedescendant]="isOpen() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
            [disabled]="disabled()"
            class="w-full bg-surface px-3.5 py-2 rounded-sm border border-line flex items-center justify-between gap-2 text-left cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed focus:ring-3 focus:ring-primary/40 focus:border-muted/75"
            (click)="toggle()"
            (keydown)="onKeydown($event)"
        >
            <span class="flex items-center gap-2 min-w-0" [class.text-muted]="!selected">
                @if (selected?.color; as color) {
                    <span class="size-3 rounded-full border border-ink/50 shrink-0" [style.background-color]="color"></span>
                }
                <span class="truncate">{{ selected?.label ?? placeholder }}</span>
            </span>
            <svg
                lucideChevronDown
                [size]="16"
                class="shrink-0 transition-transform"
                [class.rotate-180]="isOpen()"
            ></svg>
        </button>

        @if (isOpen()) {
            <ul
                #listbox
                [id]="uid + '-listbox'"
                role="listbox"
                [attr.aria-label]="label || null"
                [style]="panelStyle()"
                class="z-50 overflow-auto bg-surface border border-line rounded shadow-lg"
            >
                @for (option of options; track option.value; let i = $index) {
                    <li
                        [id]="optionId(i)"
                        role="option"
                        [attr.aria-selected]="option.value === value()"
                        [class.bg-secondary/25]="option.value === value()"
                        [class.bg-deep]="i === activeIndex()"
                        class="flex items-center gap-2 px-3 py-2 cursor-pointer"
                        (mouseenter)="activeIndex.set(i)"
                        (click)="choose(option)"
                    >
                        @if (option.color) {
                            <span class="size-3 rounded-full border border-ink/50 shrink-0" [style.background-color]="option.color"></span>
                        }
                        <span class="flex-1 truncate">{{ option.label }}</span>
                        @if (option.value === value()) {
                            <svg lucideCheck [size]="16"></svg>
                        }
                    </li>
                } @empty {
                    <li class="px-3 py-2 text-muted">Aucun résultat</li>
                }
            </ul>
        }
    </div>
</div>
