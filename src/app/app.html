@if (authService.isAuthenticated()) {
    <header class="border-b border-line px-6 py-4 lg:w-5xl lg:px-0 mx-auto flex items-center justify-center">
        <a routerLink="/" class="w-full lg:w-5xl flex items-center gap-3">
            <img src="/icons/icon-96x96.png" alt="Logo Groceries" class="size-12">
            <h3 class="hidden lg:inline">Super Groceries</h3>
        </a>
        <button app-button routerLink="/parametres" variant="outline" shape="round">
            <svg lucideSettings [size]="24"></svg>
        </button>
    </header>
}

<main class="flex-1 w-full mx-auto lg:w-5xl [&_section]:py-4 [&_section]:px-6 lg:[&_section]:px-0">
    <router-outlet />
</main>
