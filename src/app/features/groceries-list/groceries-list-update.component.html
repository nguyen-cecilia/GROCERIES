<form class="space-y-6" (submit)="onSubmit($event)" novalidate>
    <div class="flex flex-col lg:flex-row lg:items-start gap-3">
        <label for="label" class="flex-1">
            <p>Label</p>
            <input type="text" id="label" placeholder="Ex : Courses du samedi" [formField]="form.label">
        </label>

        <app-input-price id="budget" label="Budget" class="w-1/3" [formField]="form.budget"/>
    </div>

    <app-message variant="error" [message]="error()"/>

    <div class="flex items-center justify-between gap-3">
        @if (editing()) {
            <button app-button variant="invalid" (click)="onDelete()">
                <svg lucideTrash2 [size]="16"></svg>
                Supprimer
            </button>
        }

        <div class="flex items-center gap-3">
            @if (editing(); as list) {
                <button
                    app-button
                    variant="outline"
                    [disabled]="groceriesListService.duplicating() === list.id"
                    (click)="onDuplicate()"
                >
                    <svg lucideCopy [size]="16"></svg>
                    Dupliquer
                </button>
            }

            <button app-button type="submit" [disabled]="!canSubmit() || loading()">
                <svg lucideSave [size]="16"></svg>
                Sauvegarder
            </button>
        </div>
    </div>
</form>
