<form class="space-y-6" (submit)="onSubmit($event)" novalidate>
    <label for="label">
        <p>Label</p>
        <input type="text" id="label" placeholder="Ex : Banane" [formField]="form.label">
    </label>

    <div class="grid grid-cols-[minmax(0,3fr)_minmax(0,2fr)] lg:grid-cols-[minmax(0,3fr)_minmax(0,1fr)] items-start gap-x-3 gap-y-2">
        <app-select
            label="Rayon"
            placeholder="Aucun rayon"
            class="flex-1"
            [options]="aisleOptions()"
            [formField]="form.aisle_id"
        />

        <app-input-price id="article-price" label="Prix" [formField]="form.price"/>

        @if (lastPrice() !== null) {
            <div class="col-span-2 flex justify-end">
                <button
                    app-button
                    variant="link"
                    class="text-sm"
                    title="Utiliser le dernier prix"
                    [disabled]="lastPrice() === model().price"
                    (click)="applyLastPrice()"
                >
                    dernier prix : {{ lastPrice() | currency:'EUR' }}
                </button>
            </div>
        }
    </div>

    <div class="flex items-start gap-x-3 gap-y-2">
        <app-input-quantity
            label="Quantité"
            radius="sm"
            [formField]="form.quantity"
        />

        <app-select
            label="Unité"
            placeholder="Aucune unité"
            [options]="unitOptions()"
            class="flex-1"
            [formField]="form.quantity_unit_id"
        />
    </div>

    <app-message variant="error" [message]="error()"/>

    <div class="flex items-center justify-between gap-3">
        @if (editing()) {
            <button
                app-button
                variant="invalid"
                [disabled]="loading()"
                (click)="onDelete()"
            >
                <svg lucideCircleX [size]="16"></svg>
                Retirer
            </button>
        }

        <button app-button type="submit" [disabled]="!canSubmit() || loading()" class="ml-auto">
            <svg lucideSave [size]="16"></svg>
            Sauvegarder
        </button>
    </div>
</form>
