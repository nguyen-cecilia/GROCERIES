<form class="space-y-6">
    <label for="label">
        <p>Label</p>
        <input type="text" id="label" placeholder="Ex : kg">
    </label>

    <label for="applyQuantity" class="flex items-center gap-3 cursor-pointer">
        <input
            type="checkbox"
            id="applyQuantity"
        >
        <div>
            <p>Prendre en compte la quantité</p>
            <p class="text-muted text-sm">
                <!-- TODO: Afficher le bon texte -->
                @if (true) {
                    Le prix saisi est multiplié par la quantité (ex : 2 × 1,25&nbsp;€ = 2,50&nbsp;€)
                } @else {
                    Le prix saisi est pour la quantité donnée (ex : 2 kg à 1,25&nbsp;€)
                }
            </p>
        </div>
    </label>

    <div class="flex items-center justify-between gap-3">
        <button app-button variant="invalid">
            <svg lucideTrash [size]="16"></svg>
            Supprimer
        </button>

        <button app-button class="ml-auto">
            <svg lucideSave [size]="16"></svg>
            Sauvegarder
        </button>
    </div>
</form>
