<section class="flex flex-col items-center justify-center min-h-dvh gap-6">
    <img src="/icons/icon-192x192.png" alt="Logo" class="rounded w-20">

    <h2>Super Groceries</h2>

    <form class="bg-surface shadow-xl border border-line rounded px-6 py-4 flex flex-col gap-3 lg:w-sm"
          (submit)="onSubmit($event)" novalidate>
        <label for="email">
            <p>Email</p>
            <input type="email" id="email" placeholder="user@example.com" autocomplete="email" [formField]="loginForm.email">
        </label>
        <label for="password">
            <p>Mot de passe</p>
            <input type="password" id="password" autocomplete="current-password" [formField]="loginForm.password">
        </label>

        @if (error()) {
            <p role="alert" class="text-secondary text-sm">{{ error() }}</p>
        }

        <button app-button type="submit" shape="bigPill" class="self-center"
                [disabled]="!canSubmit() || loading()">
            {{ loading() ? 'Connexion…' : 'Se connecter' }}
        </button>
    </form>
</section>
